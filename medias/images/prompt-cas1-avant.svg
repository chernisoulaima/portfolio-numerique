<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" role="img" aria-label="Résultat du prompt faible : explication abstraite des pointeurs">
<title>Résultat du prompt faible : explication abstraite des pointeurs</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1b34"/><stop offset="1" stop-color="#12284a"/></linearGradient>
</defs>
<rect width="800" height="470" rx="18" fill="url(#bg)"/>
<rect x="0" y="0" width="800" height="52" rx="18" fill="#0e1a33"/><rect x="0" y="34" width="800" height="18" fill="#0e1a33"/>
<circle cx="26" cy="26" r="6" fill="#f87171"/><circle cx="46" cy="26" r="6" fill="#fbbf24"/><circle cx="66" cy="26" r="6" fill="#4ade80"/>
<text x="92" y="31" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#a5b1c7" text-anchor="start">Réponse de l&#x27;IA — prompt initial</text>
<rect x="630" y="13" width="150" height="26" rx="13" fill="#f87171" fill-opacity=".15" stroke="#f87171" stroke-opacity=".6"/>
<text x="705" y="31" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#f87171" text-anchor="middle">PROMPT FAIBLE</text><rect x="555.2" y="72" width="204.79999999999998" height="40" rx="12" fill="#3b82f6" fill-opacity=".22" stroke="#3b82f6" stroke-opacity=".5"/><text x="570.2" y="97" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#e6ebf5" text-anchor="start">Explique les pointeurs.</text><circle cx="52" cy="146" r="16" fill="#3b82f6"/><text x="52" y="151" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">IA</text><text x="84" y="142" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#a5b1c7" text-anchor="start">Un pointeur est une variable dont la valeur est l&#x27;adresse mémoire d&#x27;une autre</text><text x="84" y="164" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#a5b1c7" text-anchor="start">variable. Les pointeurs permettent la manipulation indirecte des données,</text><text x="84" y="186" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#a5b1c7" text-anchor="start">l&#x27;allocation dynamique, les structures chaînées et les pointeurs de fonctions :</text><rect x="84" y="210" width="680" height="64" rx="8" fill="#060a14"/><text x="100" y="236" font-family="JetBrains Mono, Consolas, monospace" font-size="13" font-weight="400" fill="#93c5fd" text-anchor="start">int (*op)(int, int) = &amp;addition;</text><text x="100" y="258" font-family="JetBrains Mono, Consolas, monospace" font-size="13" font-weight="400" fill="#8391aa" text-anchor="start">int r = (*op)(a, b);  /* pointeur de fonction */</text><rect x="84" y="295" width="640" height="9" rx="4.5" fill="#a5b1c7" fill-opacity="0.280"/><rect x="84" y="317" width="603" height="9" rx="4.5" fill="#a5b1c7" fill-opacity="0.268"/><rect x="84" y="339" width="566" height="9" rx="4.5" fill="#a5b1c7" fill-opacity="0.256"/><rect x="84" y="361" width="529" height="9" rx="4.5" fill="#a5b1c7" fill-opacity="0.244"/><rect x="24" y="412" width="752" height="38" rx="10" fill="#f87171" fill-opacity=".10" stroke="#f87171" stroke-opacity=".35"/><text x="42" y="436" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#f87171" text-anchor="start">✕  Définition abstraite, exemple trop avancé (pointeurs de fonctions), aucune structure.</text>
</svg>