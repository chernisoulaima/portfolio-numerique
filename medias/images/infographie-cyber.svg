<rect width="800" height="1060" rx="18" fill="url(#bg)"/>
<text x="400.0" y="74" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#93c5fd" text-anchor="middle">SE PROTÉGER SUR INTERNET</text><text x="400.0" y="118" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="36" font-weight="800" fill="#fff" text-anchor="middle">6 réflexes qui changent tout</text><rect x="360.0" y="138" width="80" height="4" rx="2" fill="#e0c766"/><rect x="40" y="180" width="350" height="150" rx="16" fill="#ffffff" fill-opacity=".05" stroke="#22304b"/><circle cx="92" cy="236" r="30" fill="#3b82f6" fill-opacity=".15"/><g transform="translate(92 236)" style="color:#3b82f6" color="#3b82f6"><rect x="-14" y="-4" width="28" height="22" rx="4" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M-8 -4v-6a8 8 0 0 1 16 0v6" fill="none" stroke="currentColor" stroke-width="2.5"/></g><text x="66" y="292" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="800" fill="#3b82f6" text-anchor="start">01</text><text x="140" y="230" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="start">Mots de passe uniques</text><text x="140" y="258" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#a5b1c7" text-anchor="start">Une phrase de passe de 12+</text><text x="140" y="279" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#a5b1c7" text-anchor="start">caractères par compte.</text><rect x="410" y="180" width="350" height="150" rx="16" fill="#ffffff" fill-opacity=".05" stroke="#22304b"/><circle cx="462" cy="236" r="30" fill="#2dd4bf" fill-opacity=".15"/><g transform="translate(462 236)" style="color:#2dd4bf" color="#2dd4bf"><circle cx="-6" cy="0" r="8" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M2 0h16M12 0v7M17 0v5" stroke="currentColor" stroke-width="2.5" fill="none"/></g><text x="436" y="292" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="800" fill="#2dd4bf" text-anchor="start">02</text><text x="510" y="230" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="start">Double authentification</text><text x="510" y="258" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#a5b1c7" text-anchor="start">Un code en plus du mot de</text><text x="510" y="279" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#a5b1c7" text-anchor="start">passe : le compte reste sûr.</text><rect x="40" y="350" width="350" height="150" rx="16" fill="#ffffff" fill-opacity=".05" stroke="#22304b"/><circle cx="92" cy="406" r="30" fill="#e0c766" fill-opacity=".15"/><g transform="translate(92 406)" style="color:#e0c766" color="#e0c766"><path d="M12 -8A14 14 0 1 0 14 6" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M14 -16v9h-9" fill="none" stroke="currentColor" stroke-width="2.5"/></g><text x="66" y="462" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="800" fill="#e0c766" text-anchor="start">03</text><text x="140" y="400" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="start">Mises à jour</text><text x="140" y="428" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#a5b1c7" text-anchor="start">Elles corrigent les failles</text><text x="140" y="449" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#a5b1c7" text-anchor="start">utilisées par les pirates.</text><rect x="410" y="350" width="350" height="150" rx="16" fill="#ffffff" fill-opacity=".05" stroke="#22304b"/><circle cx="462" cy="406" r="30" fill="#4ade80" fill-opacity=".15"/><g transform="translate(462 406)" style="color:#4ade80" color="#4ade80"><path d="M0 -16l14 5v9c0 9-6 15-14 18-8-3-14-9-14-18v-9z" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M-6 0l4 4 8-8" fill="none" stroke="currentColor" stroke-width="2.5"/></g><text x="436" y="462" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="800" fill="#4ade80" text-anchor="start">04</text><text x="510" y="400" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="start">Antivirus actif</text><text x="510" y="428" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#a5b1c7" text-anchor="start">Il bloque les malwares connus</text><text x="510" y="449" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#a5b1c7" text-anchor="start">avant qu&#x27;ils ne s&#x27;installent.</text><rect x="40" y="520" width="350" height="150" rx="16" fill="#ffffff" fill-opacity=".05" stroke="#22304b"/><circle cx="92" cy="576" r="30" fill="#a78bfa" fill-opacity=".15"/><g transform="translate(92 576)" style="color:#a78bfa" color="#a78bfa"><rect x="-14" y="-14" width="28" height="28" rx="4" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M-8 -14v9h14v-9M-8 14v-9h16v9" fill="none" stroke="currentColor" stroke-width="2.5"/></g><text x="66" y="632" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="800" fill="#a78bfa" text-anchor="start">05</text><text x="140" y="570" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="start">Sauvegardes</text><text x="140" y="598" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#a5b1c7" text-anchor="start">Hors ligne : la meilleure</text><text x="140" y="619" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#a5b1c7" text-anchor="start">parade aux rançongiciels.</text><rect x="410" y="520" width="350" height="150" rx="16" fill="#ffffff" fill-opacity=".05" stroke="#22304b"/><circle cx="462" cy="576" r="30" fill="#fb7185" fill-opacity=".15"/><g transform="translate(462 576)" style="color:#fb7185" color="#fb7185"><path d="M-16 0c4-8 10-11 16-11s12 3 16 11c-4 8-10 11-16 11s-12-3-16-11z" fill="none" stroke="currentColor" stroke-width="2.5"/><circle r="5" fill="none" stroke="currentColor" stroke-width="2.5"/></g><text x="436" y="632" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="800" fill="#fb7185" text-anchor="start">06</text><text x="510" y="570" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="start">Vigilance</text><text x="510" y="598" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#a5b1c7" text-anchor="start">Vérifier liens, expéditeurs</text><text x="510" y="619" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#a5b1c7" text-anchor="start">et pièces jointes.</text><text x="40" y="710" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#fff" text-anchor="start">Les principaux malwares</text><rect x="40" y="730" width="134" height="84" rx="12" fill="#f87171" fill-opacity=".08" stroke="#f87171" stroke-opacity=".35"/><text x="107" y="766" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Virus</text><text x="107" y="790" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#a5b1c7" text-anchor="middle">s&#x27;attache à un fichier</text><rect x="186" y="730" width="134" height="84" rx="12" fill="#f87171" fill-opacity=".08" stroke="#f87171" stroke-opacity=".35"/><text x="253" y="766" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Ver</text><text x="253" y="790" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#a5b1c7" text-anchor="middle">se propage seul</text><rect x="332" y="730" width="134" height="84" rx="12" fill="#f87171" fill-opacity=".08" stroke="#f87171" stroke-opacity=".35"/><text x="399" y="766" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Cheval de Troie</text><text x="399" y="790" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#a5b1c7" text-anchor="middle">se déguise</text><rect x="478" y="730" width="134" height="84" rx="12" fill="#f87171" fill-opacity=".08" stroke="#f87171" stroke-opacity=".35"/><text x="545" y="766" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Rançongiciel</text><text x="545" y="790" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#a5b1c7" text-anchor="middle">chiffre et rançonne</text><rect x="624" y="730" width="134" height="84" rx="12" fill="#f87171" fill-opacity=".08" stroke="#f87171" stroke-opacity=".35"/><text x="691" y="766" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Spyware</text><text x="691" y="790" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#a5b1c7" text-anchor="middle">espionne</text><rect x="40" y="860" width="720" height="110" rx="16" fill="#e0c766" fill-opacity=".08" stroke="#e0c766" stroke-opacity=".4"/><text x="64" y="896" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#e0c766" text-anchor="start">Repérer un hameçonnage (phishing)</text><text x="64" y="926" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#e6ebf5" text-anchor="start">Urgence (« compte bloqué sous 24 h ») · fautes · expéditeur étrange ·</text><text x="64" y="948" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#e6ebf5" text-anchor="start">lien qui ne correspond pas au site officiel · demande d&#x27;identifiants ou de paiement.</text><text x="400.0" y="1024" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#8391aa" text-anchor="middle">Sources : cybermalveillance.gouv.fr · cyber.gouv.fr (ANSSI)  —  Portfolio de Soulaima</text>
