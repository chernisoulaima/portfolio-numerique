<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 412" width="800" height="412" role="img" aria-label="Terminal Linux — commandes de base"><title>Terminal Linux — commandes de base</title><rect x="0" y="0" width="800" height="412" rx="18" fill="#060a14"/><rect x="0" y="0" width="800" height="44" rx="18" fill="#111a2e"/><rect x="0" y="26" width="800" height="18" fill="#111a2e"/><circle cx="24" cy="22" r="6" fill="#f87171"/><circle cx="44" cy="22" r="6" fill="#fbbf24"/><circle cx="64" cy="22" r="6" fill="#4ade80"/><text x="400" y="27" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#8391aa" text-anchor="middle">Terminal Linux — commandes de base</text><text x="24" y="78" font-family="JetBrains Mono, Consolas, monospace" font-size="14"><tspan fill="#4ade80">soulaima@ubuntu</tspan><tspan fill="#8391aa">:</tspan><tspan fill="#93c5fd">~/tp-os</tspan><tspan fill="#8391aa">$ </tspan><tspan fill="#fff">pwd</tspan></text><text x="24" y="102" font-family="JetBrains Mono, Consolas, monospace" font-size="14" font-weight="400" fill="#a5b1c7" text-anchor="start">/home/soulaima/tp-os</text><text x="24" y="126" font-family="JetBrains Mono, Consolas, monospace" font-size="14"><tspan fill="#4ade80">soulaima@ubuntu</tspan><tspan fill="#8391aa">:</tspan><tspan fill="#93c5fd">~/tp-os</tspan><tspan fill="#8391aa">$ </tspan><tspan fill="#fff">mkdir cours &amp;&amp; cd cours</tspan></text><text x="24" y="150" font-family="JetBrains Mono, Consolas, monospace" font-size="14"><tspan fill="#4ade80">soulaima@ubuntu</tspan><tspan fill="#8391aa">:</tspan><tspan fill="#93c5fd">~/tp-os</tspan><tspan fill="#8391aa">$ </tspan><tspan fill="#fff">touch notes.txt</tspan></text><text x="24" y="174" font-family="JetBrains Mono, Consolas, monospace" font-size="14"><tspan fill="#4ade80">soulaima@ubuntu</tspan><tspan fill="#8391aa">:</tspan><tspan fill="#93c5fd">~/tp-os</tspan><tspan fill="#8391aa">$ </tspan><tspan fill="#fff">echo &quot;Le noyau gère les processus&quot; &gt; notes.txt</tspan></text><text x="24" y="198" font-family="JetBrains Mono, Consolas, monospace" font-size="14"><tspan fill="#4ade80">soulaima@ubuntu</tspan><tspan fill="#8391aa">:</tspan><tspan fill="#93c5fd">~/tp-os</tspan><tspan fill="#8391aa">$ </tspan><tspan fill="#fff">cat notes.txt</tspan></text><text x="24" y="222" font-family="JetBrains Mono, Consolas, monospace" font-size="14" font-weight="400" fill="#a5b1c7" text-anchor="start">Le noyau gère les processus</text><text x="24" y="246" font-family="JetBrains Mono, Consolas, monospace" font-size="14"><tspan fill="#4ade80">soulaima@ubuntu</tspan><tspan fill="#8391aa">:</tspan><tspan fill="#93c5fd">~/tp-os</tspan><tspan fill="#8391aa">$ </tspan><tspan fill="#fff">ls -l</tspan></text><text x="24" y="270" font-family="JetBrains Mono, Consolas, monospace" font-size="14" font-weight="400" fill="#a5b1c7" text-anchor="start">-rw-r--r-- 1 soulaima soulaima 29 nov. 22 10:12 notes.txt</text><text x="24" y="294" font-family="JetBrains Mono, Consolas, monospace" font-size="14"><tspan fill="#4ade80">soulaima@ubuntu</tspan><tspan fill="#8391aa">:</tspan><tspan fill="#93c5fd">~/tp-os</tspan><tspan fill="#8391aa">$ </tspan><tspan fill="#fff">ps aux | head -3</tspan></text><text x="24" y="318" font-family="JetBrains Mono, Consolas, monospace" font-size="14" font-weight="400" fill="#a5b1c7" text-anchor="start">USER     PID %CPU %MEM COMMAND</text><text x="24" y="342" font-family="JetBrains Mono, Consolas, monospace" font-size="14" font-weight="400" fill="#a5b1c7" text-anchor="start">root       1  0.0  0.1 /sbin/init</text><text x="24" y="366" font-family="JetBrains Mono, Consolas, monospace" font-size="14" font-weight="400" fill="#a5b1c7" text-anchor="start">soulaima 812  0.3  1.2 bash</text></svg>