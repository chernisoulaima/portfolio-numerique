<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" role="img" aria-label="Comparaison des outils avec consigne : sources et incertitudes signalées">
<title>Comparaison des outils avec consigne : sources et incertitudes signalées</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1b34"/><stop offset="1" stop-color="#12284a"/></linearGradient>
</defs>
<rect width="800" height="470" rx="18" fill="url(#bg)"/>
<rect x="0" y="0" width="800" height="52" rx="18" fill="#0e1a33"/><rect x="0" y="34" width="800" height="18" fill="#0e1a33"/>
<circle cx="26" cy="26" r="6" fill="#f87171"/><circle cx="46" cy="26" r="6" fill="#fbbf24"/><circle cx="66" cy="26" r="6" fill="#4ade80"/>
<text x="92" y="31" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#a5b1c7" text-anchor="start">Comparaison des outils — prompt amélioré</text>
<rect x="630" y="13" width="150" height="26" rx="13" fill="#4ade80" fill-opacity=".15" stroke="#4ade80" stroke-opacity=".6"/>
<text x="705" y="31" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#4ade80" text-anchor="middle">PROMPT AMÉLIORÉ</text><rect x="40" y="76" width="720" height="72" rx="12" fill="#ffffff" fill-opacity=".04" stroke="#22304b"/><text x="60" y="104" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#e6ebf5" text-anchor="start">Perplexity</text><text x="60" y="128" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#a5b1c7" text-anchor="start">3 exemples récents, chaque phrase liée à une source officielle.</text><rect x="616" y="92" width="128" height="26" rx="13" fill="#4ade80" fill-opacity=".15"/><text x="680" y="110" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#4ade80" text-anchor="middle">ANSSI ✓</text><rect x="40" y="162" width="720" height="72" rx="12" fill="#ffffff" fill-opacity=".04" stroke="#22304b"/><text x="60" y="190" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#e6ebf5" text-anchor="start">Outil A</text><text x="60" y="214" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#a5b1c7" text-anchor="start">Signale ce qu&#x27;il ne peut pas vérifier : « à confirmer ».</text><rect x="616" y="178" width="128" height="26" rx="13" fill="#e0c766" fill-opacity=".15"/><text x="680" y="196" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#e0c766" text-anchor="middle">Incertitude ✓</text><rect x="40" y="248" width="720" height="72" rx="12" fill="#ffffff" fill-opacity=".04" stroke="#22304b"/><text x="60" y="276" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#e6ebf5" text-anchor="start">Outil B</text><text x="60" y="300" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#a5b1c7" text-anchor="start">Exemples utiles, mais une source n&#x27;existait pas → retirée.</text><rect x="616" y="264" width="128" height="26" rx="13" fill="#f87171" fill-opacity=".15"/><text x="680" y="282" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#f87171" text-anchor="middle">Source vérifiée</text><text x="40" y="358" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#93c5fd" text-anchor="start">Sources retenues : cybermalveillance.gouv.fr · cyber.gouv.fr (ANSSI)</text><rect x="24" y="412" width="752" height="38" rx="10" fill="#4ade80" fill-opacity=".10" stroke="#4ade80" stroke-opacity=".35"/><text x="42" y="436" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#4ade80" text-anchor="start">✓  Demander des sources et l&#x27;aveu d&#x27;incertitude rend les erreurs visibles et vérifiables.</text>
</svg>