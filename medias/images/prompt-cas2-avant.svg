<rect width="800" height="470" rx="18" fill="url(#bg)"/>
<rect x="0" y="0" width="800" height="52" rx="18" fill="#0e1a33"/><rect x="0" y="34" width="800" height="18" fill="#0e1a33"/>
<circle cx="26" cy="26" r="6" fill="#f87171"/><circle cx="46" cy="26" r="6" fill="#fbbf24"/><circle cx="66" cy="26" r="6" fill="#4ade80"/>
<text x="92" y="31" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#a5b1c7" text-anchor="start">Réponse de l&#x27;IA — prompt initial</text>
<rect x="630" y="13" width="150" height="26" rx="13" fill="#f87171" fill-opacity=".15" stroke="#f87171" stroke-opacity=".6"/>
<text x="705" y="31" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#f87171" text-anchor="middle">PROMPT FAIBLE</text><rect x="342.40000000000003" y="72" width="417.59999999999997" height="40" rx="12" fill="#3b82f6" fill-opacity=".22" stroke="#3b82f6" stroke-opacity=".5"/><text x="357.40000000000003" y="97" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#e6ebf5" text-anchor="start">Fais-moi une fiche sur les systèmes d&#x27;exploitation.</text><circle cx="52" cy="146" r="16" fill="#3b82f6"/><text x="52" y="151" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">IA</text><text x="84" y="142" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#a5b1c7" text-anchor="start">Un système d&#x27;exploitation est un ensemble de programmes qui gère les ressources</text><text x="84" y="164" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#a5b1c7" text-anchor="start">matérielles et logicielles d&#x27;un ordinateur. Historiquement, les premiers systèmes</text><text x="84" y="186" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#a5b1c7" text-anchor="start">datent des années 1950 avec le traitement par lots, puis sont apparus le temps</text><rect x="84" y="207" width="660" height="9" rx="4.5" fill="#a5b1c7" fill-opacity="0.280"/><rect x="84" y="229" width="623" height="9" rx="4.5" fill="#a5b1c7" fill-opacity="0.268"/><rect x="84" y="251" width="586" height="9" rx="4.5" fill="#a5b1c7" fill-opacity="0.256"/><rect x="84" y="273" width="549" height="9" rx="4.5" fill="#a5b1c7" fill-opacity="0.244"/><rect x="84" y="295" width="632" height="9" rx="4.5" fill="#a5b1c7" fill-opacity="0.232"/><rect x="84" y="317" width="595" height="9" rx="4.5" fill="#a5b1c7" fill-opacity="0.220"/><rect x="84" y="339" width="558" height="9" rx="4.5" fill="#a5b1c7" fill-opacity="0.208"/><rect x="84" y="361" width="641" height="9" rx="4.5" fill="#a5b1c7" fill-opacity="0.196"/><rect x="24" y="412" width="752" height="38" rx="10" fill="#f87171" fill-opacity=".10" stroke="#f87171" stroke-opacity=".35"/><text x="42" y="436" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#f87171" text-anchor="start">✕  Long texte sans hiérarchie ni exemples : difficile à réviser.</text>
</svg>