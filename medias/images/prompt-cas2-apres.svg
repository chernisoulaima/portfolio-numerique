<text x="705" y="31" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#4ade80" text-anchor="middle">PROMPT AMÉLIORÉ</text><rect x="84" y="80" width="680" height="34" rx="6" fill="#3b82f6" fill-opacity=".25"/><text x="98" y="102" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#e6ebf5" text-anchor="start">Rôle</text><text x="240" y="102" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#e6ebf5" text-anchor="start">Définition</text><text x="540" y="102" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#e6ebf5" text-anchor="start">Exemple concret</text><rect x="84" y="114" width="680" height="36" fill="#ffffff" fill-opacity="0.06"/><text x="98" y="137" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#e0c766" text-anchor="start">Processus</text><text x="240" y="137" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#a5b1c7" text-anchor="start">Programme en exécution, partage du CPU</text><text x="540" y="137" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#a5b1c7" text-anchor="start">Musique + navigateur</text><rect x="84" y="150" width="680" height="36" fill="#ffffff" fill-opacity="0.03"/><text x="98" y="173" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#e0c766" text-anchor="start">Mémoire</text><text x="240" y="173" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#a5b1c7" text-anchor="start">Attribue et libère la RAM</text><text x="540" y="173" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#a5b1c7" text-anchor="start">Onglets fermés = RAM libérée</text><rect x="84" y="186" width="680" height="36" fill="#ffffff" fill-opacity="0.06"/><text x="98" y="209" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#e0c766" text-anchor="start">Fichiers</text><text x="240" y="209" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#a5b1c7" text-anchor="start">Organise les données en dossiers</text><text x="540" y="209" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#a5b1c7" text-anchor="start">Explorateur, droits</text><rect x="84" y="222" width="680" height="36" fill="#ffffff" fill-opacity="0.03"/><text x="98" y="245" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#e0c766" text-anchor="start">Périphériques</text><text x="240" y="245" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#a5b1c7" text-anchor="start">Pilote le matériel via les drivers</text><text x="540" y="245" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#a5b1c7" text-anchor="start">Brancher une clé USB</text><text x="84" y="290" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#e0c766" text-anchor="start">QCM (5 questions)</text><text x="84" y="314" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#a5b1c7" text-anchor="start">1. Comment appelle-t-on un programme en cours d&#x27;exécution ?   a) fichier  b) processus  c) pilote</text><text x="84" y="336" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#a5b1c7" text-anchor="start">2. Quel composant traduit les ordres de l&#x27;OS pour le matériel ?   a) le pilote  b) la RAM  c) le BIOS</text><text x="84" y="358" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#a5b1c7" text-anchor="start">…   Correction à la fin : 1-b, 2-a, 3-c, 4-a, 5-b</text><rect x="24" y="412" width="752" height="38" rx="10" fill="#4ade80" fill-opacity=".10" stroke="#4ade80" stroke-opacity=".35"/><text x="42" y="436" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#4ade80" text-anchor="start">✓  Tableau clair + QCM corrigé : la fiche est directement utilisable pour réviser.</text>
