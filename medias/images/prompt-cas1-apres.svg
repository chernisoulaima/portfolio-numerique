<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" role="img" aria-label="Résultat du prompt amélioré : analogie, code commenté et erreurs fréquentes">
<title>Résultat du prompt amélioré : analogie, code commenté et erreurs fréquentes</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1b34"/><stop offset="1" stop-color="#12284a"/></linearGradient>
</defs>
<rect width="800" height="470" rx="18" fill="url(#bg)"/>
<rect x="0" y="0" width="800" height="52" rx="18" fill="#0e1a33"/><rect x="0" y="34" width="800" height="18" fill="#0e1a33"/>
<circle cx="26" cy="26" r="6" fill="#f87171"/><circle cx="46" cy="26" r="6" fill="#fbbf24"/><circle cx="66" cy="26" r="6" fill="#4ade80"/>
<text x="92" y="31" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#a5b1c7" text-anchor="start">Réponse de l&#x27;IA — prompt amélioré</text>
<rect x="630" y="13" width="150" height="26" rx="13" fill="#4ade80" fill-opacity=".15" stroke="#4ade80" stroke-opacity=".6"/>
<text x="705" y="31" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#4ade80" text-anchor="middle">PROMPT AMÉLIORÉ</text><circle cx="52" cy="86" r="16" fill="#3b82f6"/><text x="52" y="91" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">IA</text><text x="84" y="86" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#e0c766" text-anchor="start">1. L&#x27;analogie</text><text x="84" y="108" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#a5b1c7" text-anchor="start">Une variable est une maison ; un pointeur est le papier où l&#x27;on a noté son adresse.</text><text x="84" y="146" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#e0c766" text-anchor="start">2. Un exemple commenté</text><rect x="84" y="158" width="680" height="112" rx="8" fill="#060a14"/><text x="100" y="182" font-family="JetBrains Mono, Consolas, monospace" font-size="13" font-weight="400" fill="#e2e8f0" text-anchor="start">int x = 5;          // une maison qui contient 5</text><text x="100" y="203" font-family="JetBrains Mono, Consolas, monospace" font-size="13" font-weight="400" fill="#93c5fd" text-anchor="start">int *p = &amp;x;        // p note l&#x27;adresse de x</text><text x="100" y="224" font-family="JetBrains Mono, Consolas, monospace" font-size="13" font-weight="400" fill="#93c5fd" text-anchor="start">*p = 8;             // on modifie x via son adresse</text><text x="100" y="245" font-family="JetBrains Mono, Consolas, monospace" font-size="13" font-weight="400" fill="#e2e8f0" text-anchor="start">printf(&quot;%d&quot;, x);    // affiche 8</text><text x="84" y="298" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#e0c766" text-anchor="start">3. Deux erreurs fréquentes</text><text x="84" y="320" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#a5b1c7" text-anchor="start">•  Utiliser un pointeur non initialisé (adresse au hasard).</text><text x="84" y="342" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#a5b1c7" text-anchor="start">•  Oublier * : on modifie l&#x27;adresse au lieu de la valeur.</text><text x="84" y="378" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#e6ebf5" text-anchor="start">Question : que vaut x si on écrit *p = *p + 1 ?</text><rect x="24" y="412" width="752" height="38" rx="10" fill="#4ade80" fill-opacity=".10" stroke="#4ade80" stroke-opacity=".35"/><text x="42" y="436" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#4ade80" text-anchor="start">✓  Niveau adapté, structure en 3 étapes, code court et commenté, question de vérification.</text>
</svg>