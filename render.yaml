# Configuration Render : site statique (HTML, CSS, JavaScript), sans étape de build
services:
  - type: web
    name: portfolio-soulaima
    runtime: static
    buildCommand: ""
    staticPublishPath: .
    pullRequestPreviewsEnabled: false
    headers:
      - path: /medias/*
        name: Cache-Control
        value: public, max-age=604800
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
